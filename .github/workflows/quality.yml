name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements_test.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy custom_components/google_health
      - run: python -m pytest --cov=custom_components.google_health --cov-report=term-missing
